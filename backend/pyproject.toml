[project]
name = "mobile-dev-platform"
version = "1.0.0"
description = "移动端开发管理平台"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.31.0",
    "celery>=5.6.0",
    "redis>=7.3.0",
    "python-jose>=3.5.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "uvicorn>=0.42.0",
    "alembic>=1.18.0",
    "passlib>=1.7.4",
]
[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
